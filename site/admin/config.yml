backend:
  name: git-gateway
  branch: main

media_folder: "site/images"
public_folder: "images"

collections:
  - name: "daire"
    label: "Daire"
    folder: "content/daire"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "İlan Başlığı", name: "title", widget: "string"}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "Tanıtım Videosu", name: "video", widget: "file", required: false}
      - label: "İlan Durumu", name: "durum", widget: "select", options: ["Satılık", "Kiralık"]}
      - {label: "Fiyat", name: "fiyat", widget: "string"}
      - {label: "Brüt m²", name: "brut", widget: "string"}
      - {label: "Net m²", name: "net", widget: "string"}
      - label: "Oda Sayısı", name: "odasayisi", widget: "select", options: ["1+0", "1+1", "2+1", "3+1", "4+1", "4+2", "5+1"]}
      - {label: "Bina Yaşı", name: "binayasi", widget: "string"}
      - {label: "Bulunduğu Kat", name: "kat", widget: "string"}
      - {label: "Kat Sayısı", name: "katsayisi", widget: "string"}
      - {label: "İlçe", name: "ilce", widget: "string"}
      - {label: "Mahalle", name: "mahalle", widget: "string"}
      - {label: "Açıklama", name: "body", widget: "markdown"}

  - name: "mustakilev"
    label: "Müstakil Ev"
    folder: "content/mustakilev"
    create: true
    slug: "{{slug}}"
    fields:
