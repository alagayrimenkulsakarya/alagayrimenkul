backend:
  name: github
  repo: alagayrimenkul/alagayrimenkul.com.tr  # Kendi repository adın
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "ilanlar"
    label: "Portföy / İlanlar"
    folder: "_ilanlar"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "İlan Başlığı", name: "title", widget: "string"}
      - {label: "Kategori", name: "kategori", widget: "select", options: ["Konut - Daire", "Konut - Müstakil Ev", "Konut - Villa", "Konut - Apartman", "Arsa", "Tarla", "Ticari - Dükkan / Ofis", "Sanayi Arsası"]}
      - {label: "İlan Durumu", name: "durum", widget: "select", options: ["Satılık", "Kiralık", "Günlük Kiralık"]}
      - {label: "Fiyat (Örn: 2.250.000 TL)", name: "fiyat", widget: "string"}
      - {label: "İlan Numarası (İsteğe bağlı)", name: "ilanno", widget: "string", required: false}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "Tanıtım Videosu (İsteğe bağlı)", name: "video", widget: "file", required: false}
      - {label: "Adapazarı / İlçe / Mahalle", name: "konum", widget: "string"}
      - {label: "Oda Sayısı (Örn: 3+1)", name: "odasayisi", widget: "string", required: false}
      - {label: "Brüt m²", name: "brut", widget: "string", required: false}
      - {label: "Net m²", name: "net", widget: "string", required: false}
      - {label: "Bina Yaşı", name: "binayasi", widget: "string", required: false}
      - {label: "Bulunduğu Kat", name: "kat", widget: "string", required: false}
      - {label: "Isıtma", name: "isitma", widget: "string", required: false}
      - {label: "Geniş İlan Açıklaması", name: "body", widget: "markdown"}
