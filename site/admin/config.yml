backend:
  name: github
  repo: alagayrimenkulsakarya/alagayrimenkul
  branch: main
  auth_type: implicit

media_folder: "images"
public_folder: "/images"

collections:
  - name: "daire"
    label: "Daire İlanları"
    folder: "content/daire"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "İlan Başlığı", name: "title", widget: "string"}
      - {label: "İlan No", name: "ilanno", widget: "string"}
      - {label: "İlan Durumu", name: "durum", widget: "select", options: ["Satılık", "Kiralık"]}
      - {label: "Fiyat (TL)", name: "fiyat", widget: "string"}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "Fotoğraf Galerisi", name: "gallery", widget: "list", field: {label: "Görsel", name: "image", widget: "image"}, required: false}
      - {label: "Video Linki (YouTube / Embed)", name: "video_url", widget: "string", required: false}
      
      # Daireye Özel Bilgiler
      - {label: "Brüt m²", name: "brut", widget: "string"}
      - {label: "Net m²", name: "net", widget: "string"}
      - {label: "Oda Sayısı", name: "odasayisi", widget: "select", options: ["1+0", "1+1", "2+1", "3+1", "4+1", "4+2", "5+1"]}
      - {label: "Bina Yaşı", name: "binayasi", widget: "string"}
      - {label: "Bulunduğu Kat", name: "kat", widget: "string"}
      - {label: "Kat Sayısı", name: "katsayisi", widget: "string"}
      - {label: "Isıtma Tipi", name: "isitma", widget: "select", options: ["Kombi (Doğalgaz)", "Yerden Isıtma", "Merkezi", "Klima", "Soba"]}
      - {label: "Banyo Sayısı", name: "banyosayisi", widget: "string", default: "1"}
      - {label: "Balkon", name: "balkon", widget: "boolean", default: true}
      - {label: "Asansör", name: "asansor", widget: "boolean", default: true}
      - {label: "Otopark", name: "otopark", widget: "select", options: ["Açık Otopark", "Kapalı Otopark", "Yok"]}
      - {label: "Tapu Durumu", name: "tapu", widget: "select", options: ["Kat Mülkiyetli", "Kat İrtifaklı", "Hisseli Tapu"]}
      - {label: "İlçe", name: "ilce", widget: "string", default: "Adapazarı"}
      - {label: "Mahalle", name: "mahalle", widget: "string"}

      # Mülk Sahibi / Müşteri Bilgileri
      - label: "Mülk Sahibi Bilgileri (Gizli)"
        name: "mulk_sahibi"
        widget: "object"
        fields:
          - {label: "Adı Soyadı", name: "ad", widget: "string"}
          - {label: "Telefon Numarası", name: "telefon", widget: "string"}
          - {label: "Notlar / Açıklama", name: "notlar", widget: "text", required: false}

      # Danışman Bilgileri
      - label: "İlgilenen Danışman"
        name: "danisman"
        widget: "object"
        fields:
          - {label: "Danışman Adı", name: "adi", widget: "string", default: "Yusuf İşçi"}
          - {label: "Telefonu", name: "telefon", widget: "string", default: "0 (532) 407 53 38"}
          - {label: "Fotoğrafı", name: "fotograf", widget: "image", required: false}

      - {label: "İlan Detaylı Açıklaması", name: "body", widget: "markdown"}

  - name: "mustakilev"
    label: "Müstakil Ev / Villa"
    folder: "content/mustakilev"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "İlan Başlığı", name: "title", widget: "string"}
      - {label: "İlan No", name: "ilanno", widget: "string"}
      - {label: "İlan Durumu", name: "durum", widget: "select", options: ["Satılık", "Kiralık"]}
      - {label: "Fiyat (TL)", name: "fiyat", widget: "string"}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "Fotoğraf Galerisi", name: "gallery", widget: "list", field: {label: "Görsel", name: "image", widget: "image"}, required: false}
      - {label: "Video Linki", name: "video_url", widget: "string", required: false}
      
      # Müstakil Ev Özel Bilgileri
      - {label: "Brüt m²", name: "brut", widget: "string"}
      - {label: "Net m²", name: "net", widget: "string"}
      - {label: "Arsa Alanı m²", name: "arsa_alani", widget: "string"}
      - {label: "Oda Sayısı", name: "odasayisi", widget: "string", default: "3+1"}
      - {label: "Bina Yaşı", name: "binayasi", widget: "string"}
      - {label: "Özel Havuz", name: "havuz", widget: "boolean", default: false}
      - {label: "İlçe", name: "ilce", widget: "string", default: "Adapazarı"}
      - {label: "Mahalle / Köy", name: "mahalle", widget: "string"}

      - label: "Mülk Sahibi Bilgileri (Gizli)"
        name: "mulk_sahibi"
        widget: "object"
        fields:
          - {label: "Adı Soyadı", name: "ad", widget: "string"}
          - {label: "Telefonu", name: "telefon", widget: "string"}

      - label: "İlgilenen Danışman"
        name: "danisman"
        widget: "object"
        fields:
          - {label: "Danışman Adı", name: "adi", widget: "string", default: "Yusuf İşçi"}
          - {label: "Telefonu", name: "telefon", widget: "string", default: "0 (532) 407 53 38"}
          - {label: "Fotoğrafı", name: "fotograf", widget: "image", required: false}

      - {label: "İlan Detaylı Açıklaması", name: "body", widget: "markdown"}

  - name: "arsa"
    label: "Arsa / Tarla"
    folder: "content/arsa"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "İlan Başlığı", name: "title", widget: "string"}
      - {label: "İlan No", name: "ilanno", widget: "string"}
      - {label: "İlan Durumu", name: "durum", widget: "select", options: ["Satılık", "Kiralık"]}
      - {label: "Fiyat (TL)", name: "fiyat", widget: "string"}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "Fotoğraf Galerisi", name: "gallery", widget: "list", field: {label: "Görsel", name: "image", widget: "image"}, required: false}
      - {label: "Video Linki", name: "video_url", widget: "string", required: false}
      
      # Arsa Özel Bilgileri
      - {label: "Toplam m²", name: "arsam2", widget: "string"}
      - {label: "İmar Durumu", name: "imardurumu", widget: "select", options: ["Konut İmarlı", "Ticari İmarlı", "Sanayi İmarlı", "Tarla", "Zeytinlik", "İmarsız"]}
      - {label: "Ada No", name: "ada", widget: "string"}
      - {label: "Parsel No", name: "parsel", widget: "string"}
      - {label: "Gabari / Kat İzni", name: "gabari", widget: "string", required: false}
      - {label: "Tapu Durumu", name: "tapu", widget: "select", options: ["Müstakil Tapulu", "Hisseli Tapu"]}
      - {label: "İlçe", name: "ilce", widget: "string", default: "Adapazarı"}
      - {label: "Mahalle / Köy", name: "mahalle", widget: "string"}

      - label: "Mülk Sahibi Bilgileri (Gizli)"
        name: "mulk_sahibi"
        widget: "object"
        fields:
          - {label: "Adı Soyadı", name: "ad", widget: "string"}
          - {label: "Telefonu", name: "telefon", widget: "string"}

      - label: "İlgilenen Danışman"
        name: "danisman"
        widget: "object"
        fields:
          - {label: "Danışman Adı", name: "adi", widget: "string", default: "Yusuf İşçi"}
          - {label: "Telefonu", name: "telefon", widget: "string", default: "0 (532) 407 53 38"}
          - {label: "Fotoğrafı", name: "fotograf", widget: "image", required: false}

      - {label: "İlan Detaylı Açıklaması", name: "body", widget: "markdown"}

  - name: "isyeri"
    label: "İş Yeri"
    folder: "content/isyeri"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "İlan Başlığı", name: "title", widget: "string"}
      - {label: "İlan No", name: "ilanno", widget: "string"}
      - {label: "İlan Durumu", name: "durum", widget: "select", options: ["Satılık", "Kiralık"]}
      - {label: "Fiyat (TL)", name: "fiyat", widget: "string"}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "Fotoğraf Galerisi", name: "gallery", widget: "list", field: {label: "Görsel", name: "image", widget: "image"}, required: false}
      - {label: "Video Linki", name: "video_url", widget: "string", required: false}
      
      # İş Yeri Özel Bilgileri
      - {label: "m²", name: "m2", widget: "string"}
      - {label: "Bölüm / Oda Sayısı", name: "bolum_sayisi", widget: "string"}
      - {label: "Bulunduğu Kat", name: "kat", widget: "string"}
      - {label: "İlçe", name: "ilce", widget: "string", default: "Adapazarı"}
      - {label: "Mahalle", name: "mahalle", widget: "string"}

      - label: "Mülk Sahibi Bilgileri (Gizli)"
        name: "mulk_sahibi"
        widget: "object"
        fields:
          - {label: "Adı Soyadı", name: "ad", widget: "string"}
          - {label: "Telefonu", name: "telefon", widget: "string"}

      - label: "İlgilenen Danışman"
        name: "danisman"
        widget: "object"
        fields:
          - {label: "Danışman Adı", name: "adi", widget: "string", default: "Yusuf İşçi"}
          - {label: "Telefonu", name: "telefon", widget: "string", default: "0 (532) 407 53 38"}
          - {label: "Fotoğrafı", name: "fotograf", widget: "image", required: false}

      - {label: "İlan Detaylı Açıklaması", name: "body", widget: "markdown"}
