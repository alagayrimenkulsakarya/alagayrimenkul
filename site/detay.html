                <nav class="hidden 2xl:flex items-center space-x-6 font-medium text-slate-300 text-sm">

                <div class="flex items-center space-x-2.5 pr-2 shrink-0">

    <!-- İLAN DETAY İÇERİK -->
    <main class="max-w-[1400px] mx-auto px-4 py-10 w-full space-y-6">
        <div id="detay-icerik" class="space-y-6">
            <div class="text-center py-20 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-amber-500 text-3xl mb-3"></i>
                <p>İlan detayları yükleniyor...</p>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#070a11] text-slate-500 py-6 border-t border-slate-800 text-center text-xs mt-12">
        <p>©️ 2026 Ala Gayrimenkul. Tüm hakları saklıdır.</p>
    </footer>

    <!-- SCRIPT -->
    <script>
        async function ilanDetayiniGetir() {
            const params = new URLSearchParams(window.location.search);
            const kategori = params.get('kategori');
            const dosya = params.get('dosya');

            if (!kategori || !dosya) {
                document.getElementById('detay-icerik').innerHTML = `
                    <div class="text-center py-20 text-slate-400">
                        <p class="text-lg font-bold text-white mb-2">Aradığınız ilan bulunamadı veya yayından kaldırıldı.</p>
                        <a href="portfoy.html" class="text-amber-400 underline text-sm">Portföye dön</a>
                    </div>
                `;
                return;
            }

            const repoOwner = "alagayrimenkulsakarya";
            const repoName = "alagayrimenkul";
            const url = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/content/${kategori}/${dosya}`;

            try {
                const res = await fetch(url);
                if (res.ok) {
                    const md = await res.text();
                    const ilan = parseMarkdownKusursuz(md);
                    ilan.kategori = kategori;
                    detayiEkranaBas(ilan, repoOwner, repoName);
                } else {
                    throw new Error('İlan dosyasına ulaşılamadı.');
                }
            } catch (e) {
                document.getElementById('detay-icerik').innerHTML = `
                    <div class="text-center py-20 text-red-400">
                        <p>İlan yüklenirken hata oluştu: ${e.message}</p>
                    </div>
                `;
            }
        }

        function parseMarkdownKusursuz(md) {
            const frontmatterMatch = md.match(/---\s*([\s\S]*?)\s*---/);
            const data = { images: [], danisman: {} };
            if (!frontmatterMatch) {
                data.aciklama = md;
                return data;
            }

            const fm = frontmatterMatch[1];
            const lines = fm.split('\n');
            let currentContext = 'root';

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('danisman:')) {
                    currentContext = 'danisman';
                    return;
                }
                if (trimmed.startsWith('images:')) {
                    currentContext = 'images';
                    return;
                }

                if (currentContext === 'images' && trimmed.startsWith('-')) {
                    let val = trimmed.replace(/^-\s*['"](.*)['"]$/, '$1').replace(/^-\s*/, '');
                    if (val) data.images.push(val);
                    return;
                }

                const colonIndex = trimmed.indexOf(':');
                if (colonIndex !== -1) {
                    const key = trimmed.substring(0, colonIndex).trim();
                    let val = trimmed.substring(colonIndex + 1).trim().replace(/^['"](.*)['"]$/, '$1');

                    if (line.startsWith('  ') || line.startsWith('    ')) {
                        if (currentContext === 'danisman') {
                            data.danisman[key] = val;
                        }
                    } else {
                        if (key === 'danisman') {
                            currentContext = 'danisman';
                        } else if (key === 'images') {
                            currentContext = 'images';
                        } else {
                            currentContext = 'root';
                            data[key] = val;
                        }
                    }
                }
            });

            data.aciklama = md.replace(/---\s*([\s\S]*?)\s*---/, '').trim();
            return data;
        }

        function duzeltResimYolu(yol, owner, repo) {
            if (!yol) return '';
            if (yol.startsWith('http')) return yol;
            if (yol.startsWith('/')) yol = yol.substring(1);
            return `https://raw.githubusercontent.com/${owner}/${repo}/main/${yol}`;
        }

        function detayiEkranaBas(ilan, owner, repo) {
            document.title = `${ilan.title || 'İlan Detayı'} | Ala Gayrimenkul`;

            let resimler = [];
            if (Array.isArray(ilan.images) && ilan.images.length > 0) {
                resimler = ilan.images.map(r => duzeltResimYolu(r, owner, repo));
            } else if (ilan.image) {
                resimler = [duzeltResimYolu(ilan.image, owner, repo)];
            } else {
                resimler = ['https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200'];
            }

            const danismanFoto = duzeltResimYolu(ilan.danisman?.fotograf, owner, repo);

            // Sadece dolu ve girilmiş alanları tabloya ekleyen akıllı yapı
            let ozelliklerHtml = `
                <li class="flex justify-between py-2.5 border-b border-slate-800"><span class="text-slate-400">İlan No</span><span class="font-bold text-white">${ilan.ilanno || '-'}</span></li>
                <li class="flex justify-between py-2.5 border-b border-slate-800"><span class="text-slate-400">Emlak Tipi</span><span class="font-bold text-white">${ilan.durum || '-'}</span></li>
                <li class="flex justify-between py-2.5 border-b border-slate-800"><span class="text-slate-400">Mahalle</span><span class="font-bold text-white">${ilan.mahalle || '-'}</span></li>
            `;

            const alanEkle = (etiket, deger) => {
                if (deger && deger !== '' && deger !== 'undefined' && deger !== 'null') {
                    ozelliklerHtml += `<li class="flex justify-between py-2.5 border-b border-slate-800"><span class="text-slate-400">${etiket}</span><span class="font-bold text-white">${deger}</span></li>`;
                }
            };

            if (ilan.kategori === 'daire') {
                alanEkle('Brüt m²', ilan.fBrut);
                alanEkle('Net m²', ilan.fNet);
                alanEkle('Oda Sayısı', ilan.fOda);
                alanEkle('Bina Yaşı', ilan.fYas);
                alanEkle('Bulunduğu Kat', ilan.fKat);
                alanEkle('Kat Sayısı', ilan.fKatSayisi);
                alanEkle('Isıtma Tipi', ilan.fIsitma);
                alanEkle('Banyo Sayısı', ilan.fBanyo);
                alanEkle('Mutfak', ilan.fMutfak);
                alanEkle('Otopark', ilan.fOtopark);
                alanEkle('Takas', ilan.fTakas);
                alanEkle('Eşyalı mı?', ilan.fEsyali);
                alanEkle('Krediye Uygunluk', ilan.fKredi);
                alanEkle('Tapu Durumu', ilan.fTapu);
            } else if (ilan.kategori === 'mustakilev') {
                alanEkle('Brüt m²', ilan.fBrut);
                alanEkle('Net m²', ilan.fNet);
                alanEkle('Arsa Alanı m²', ilan.fArsaAlan);
                alanEkle('Oda Sayısı', ilan.fOda);
                alanEkle('Bina Yaşı', ilan.fYas);
                alanEkle('Kat Sayısı', ilan.fKatSayisi);
                alanEkle('Isıtma Tipi', ilan.fIsitma);
                alanEkle('Balkon', ilan.fBalkon);
                alanEkle('Takas', ilan.fTakas);
                alanEkle('Krediye Uygunluk', ilan.fKredi);
                alanEkle('Tapu Durumu', ilan.fTapu);
            } else if (ilan.kategori === 'arsa') {
                alanEkle('Toplam m²', ilan.fBrut);
                alanEkle('m² Fiyatı', ilan.fM2Fiyat);
                alanEkle('İmar Durumu', ilan.fImar);
                alanEkle('Ada / Parsel', ilan.fAdaParsel);
                alanEkle('Takas', ilan.fTakas);
                alanEkle('Tapu Durumu', ilan.fTapu);
            } else if (ilan.kategori === 'isyeri') {
                alanEkle('İş Yeri Türü', ilan.fIsTuru);
                alanEkle('m²', ilan.fBrut);
                alanEkle('Bölüm / Oda', ilan.fOda);
                alanEkle('Aidat', ilan.fAidat);
                alanEkle('Bulunduğu Kat', ilan.fKat);
                alanEkle('Takas', ilan.fTakas);
                alanEkle('Krediye Uygunluk', ilan.fKredi);
            }

            const container = document.getElementById('detay-icerik');
            container.innerHTML = `
                <!-- Üst Başlık ve Fiyat -->
                <div class="bg-[#131b2e] border border-slate-800 p-6 rounded-3xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-xl">
                    <div>
                        <span class="bg-amber-600 text-slate-950 px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider">
                            ${ilan.durum || 'Satılık'}
                        </span>
                        <h1 class="text-2xl sm:text-3xl font-black text-white mt-2">${ilan.title || ''}</h1>
                        <p class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-location-dot text-amber-500 mr-1"></i> Sakarya / ${ilan.mahalle || ''}</p>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl sm:text-3xl font-black text-amber-400">${ilan.fiyat ? ilan.fiyat + ' TL' : 'Fiyat Belirtilmemiş'}</div>
                        <p class="text-[11px] text-slate-400 mt-1">İlan No: ${ilan.ilanno || 'ALA-100'}</p>
                    </div>
                </div>

                <!-- Sahibinden Tarzı 2 Kolonlu Tam Simetrik Üst Bölüm -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
                    <!-- Sol Kolon (Büyük Fotoğraf + Değişen Küçük Resimler Galerisi): 7 Birim -->
                    <div class="lg:col-span-7 bg-[#131b2e] border border-slate-800 p-5 rounded-3xl flex flex-col justify-between shadow-xl">
                        <div class="relative h-[380px] rounded-2xl overflow-hidden bg-black border border-slate-800 mb-4">
                            <img id="ana-foto" src="${resimler[0]}" alt="${ilan.title}" class="w-full h-full object-cover transition duration-300">
                        </div>
                        <div class="flex gap-2.5 overflow-x-auto pb-1">
                            ${resimler.map((img, index) => `
                                <img src="${img}" onclick="resimDegistir('${img}', this)" class="galeri-thumb w-20 h-16 object-cover rounded-xl cursor-pointer border-2 ${index === 0 ? 'border-amber-500 scale-95' : 'border-slate-700 opacity-70'} hover:opacity-100 hover:border-amber-400 transition shrink-0">
                            `).join('')}
                        </div>
                    </div>

                    <!-- Sağ Kolon (İlan Özellikleri Tablosu): 5 Birim -->
                    <div class="lg:col-span-5 bg-[#131b2e] border border-slate-800 p-6 rounded-3xl flex flex-col justify-between shadow-xl">
                        <div>
                            <h3 class="text-sm font-extrabold text-white border-b border-slate-800 pb-3 flex items-center justify-between">
                                <span>İlan Özellikleri</span>
                                <i class="fa-solid fa-list-check text-amber-500"></i>
                            </h3>
                            <ul class="space-y-0 text-xs text-slate-300 mt-2">
                                ${ozelliklerHtml}
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Alt Bölüm: İlan Açıklaması ve Sabit Boyutlu Şık Danışman Kartı -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <!-- Sol: Açıklama (8 Birim) -->
                    <div class="lg:col-span-8 bg-[#131b2e] border border-slate-800 p-8 rounded-3xl space-y-6 shadow-xl">
                        <h2 class="text-lg font-extrabold text-white border-b border-slate-800 pb-3 flex items-center space-x-2">
                            <i class="fa-solid fa-align-left text-amber-500"></i>
                            <span>İlan Açıklaması</span>
                        </h2>
                        <div class="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap font-normal">
                            ${ilan.aciklama || 'Bu ilan için henüz açıklama girilmemiş.'}
                        </div>
                    </div>

                    <!-- Sağ: Sabit Boyutlu Şık Danışman Kartı (4 Birim) -->
                    <div class="lg:col-span-4 bg-[#131b2e] border border-slate-800 p-6 rounded-3xl space-y-6 shadow-xl">
                        <div>
                            <div class="flex items-center space-x-4">
                                <div class="w-16 h-16 rounded-2xl bg-amber-500/20 border border-amber-500/30 overflow-hidden flex items-center justify-center text-amber-400 font-bold shrink-0">
                                    ${danismanFoto ? `<img src="${danismanFoto}" class="w-full h-full object-cover">` : '<i class="fa-solid fa-user text-xl"></i>'}
                                </div>
                                <div class="overflow-hidden">
                                    <h3 class="font-extrabold text-white text-base truncate">${ilan.danisman?.adi || 'Yusuf İşçi'}</h3>
                                    <p class="text-[11px] text-amber-400 font-bold tracking-wide uppercase truncate">ALA GAYRİMENKUL DANIŞMANI</p>
                                </div>
                            </div>
                            <div class="mt-6 space-y-2 text-xs">
                                <div class="flex justify-between py-2 border-b border-slate-800">
                                    <span class="text-slate-400">Cep Telefonu</span>
                                    <span class="font-bold text-white">${ilan.danisman?.telefon || '0 (532) 407 53 38'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-2.5 pt-1">
                            <a href="tel:${ilan.danisman?.telefon || '+905324075338'}" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-center text-xs transition shadow-lg flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-phone-alt"></i>
                                <span>Danışmanı Ara</span>
                            </a>
                            <a href="https://wa.me/${(ilan.danisman?.telefon || '905324075338').replace(/[^0-9]/g, '')}" target="_blank" class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-center text-xs transition shadow-lg flex items-center justify-center space-x-2">
                                <i class="fa-brands fa-whatsapp text-base"></i>
                                <span>WhatsApp İletişim</span>
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        function resimDegistir( yeniSrc, element ) {
            document.getElementById('ana-foto').src = yeniSrc;
            document.querySelectorAll('.galeri-thumb').forEach(thumb => {
                thumb.classList.remove('border-amber-500', 'scale-95');
                thumb.classList.add('border-slate-700', 'opacity-70');
            });
            element.classList.remove('border-slate-700', 'opacity-70');
            element.classList.add('border-amber-500', 'scale-95');
        }

        window.onload = ilanDetayiniGetir;
    </script>
</body>
