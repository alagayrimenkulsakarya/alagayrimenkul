<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlan Detayı | Ala Gayrimenkul</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-[#0b0f19]/95 border-b border-slate-800/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="w-full px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex items-center space-x-2.5 shrink-0 pl-2">
                    <div class="bg-amber-600 text-slate-950 p-2.5 rounded-xl font-bold text-lg tracking-wider">ALA</div>
                    <div>
                        <span class="block font-extrabold text-lg text-white tracking-tight">ALA GAYRİMENKUL</span>
                        <span class="text-[9px] text-amber-500/80 font-medium tracking-widest uppercase">DANIŞMANLIK HİZMETLERİ</span>
                    </div>
                </a>
                <a href="portfoy.html" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Portföye Dön
                </a>
            </div>
        </div>
    </header>

    <!-- İLAN DETAY ALANI -->
    <main class="max-w-6xl mx-auto px-4 py-10 w-full space-y-8">
        <div id="detay-icerik" class="space-y-6">
            <div class="text-center py-20 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-amber-500 text-3xl mb-3"></i>
                <p>İlan detayları yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#070a11] text-slate-500 py-6 border-t border-slate-800 text-center text-xs mt-12">
        <p>©️ 2026 Ala Gayrimenkul. Tüm hakları saklıdır.</p>
    </footer>

    <!-- SCRIPT -->
    <script>
        async function ilanDetayiniGetir() {
            const params = new URLSearchParams(window.location.search);
            const kategori = params.get('kategori');
            const dosya = params.get('dosya');

            if (!kategori || !dosya) {
                document.getElementById('detay-icerik').innerHTML = `
                    <div class="text-center py-20 text-slate-400">
                        <p class="text-lg font-bold text-white mb-2">Aradığınız ilan bulunamadı veya yayından kaldırıldı.</p>
                        <a href="portfoy.html" class="text-amber-400 underline text-sm">Portföye dön</a>
                    </div>
                `;
                return;
            }

            const repoOwner = "alagayrimenkulsakarya";
            const repoName = "alagayrimenkul";
            const url = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/content/${kategori}/${dosya}`;

            try {
                const res = await fetch(url);
                if (res.ok) {
                    const md = await res.text();
                    const ilan = parseMarkdown(md);
                    detayiEkranaBas(ilan);
                } else {
                    throw new Error('İlan dosyasına ulaşılamadı.');
                }
            } catch (e) {
                document.getElementById('detay-icerik').innerHTML = `
                    <div class="text-center py-20 text-red-400">
                        <p>İlan yüklenirken hata oluştu: ${e.message}</p>
                    </div>
                `;
            }
        }

        function parseMarkdown(md) {
            const frontmatterMatch = md.match(/---\s*([\s\S]*?)\s*---/);
            if (!frontmatterMatch) return { aciklama: md };
            const fm = frontmatterMatch[1];
            const data = {};
            fm.split('\n').forEach(line => {
                const parts = line.split(':');
                if (parts.length >= 2) {
                    const key = parts[0].trim();
                    let val = parts.slice(1).join(':').trim().replace(/^['"](.*)['"]$/, '$1');
                    data[key] = val;
                }
            });
            data.aciklama = md.replace(/---\s*([\s\S]*?)\s*---/, '').trim();
            return data;
        }

        function detayiEkranaBas(ilan) {
            document.title = `${ilan.title || 'İlan Detayı'} | Ala Gayrimenkul`;

            const container = document.getElementById('detay-icerik');
            container.innerHTML = `
                <!-- Üst Başlık ve Fiyat -->
                <div class="bg-[#131b2e] border border-slate-800 p-6 rounded-3xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <span class="bg-amber-600 text-slate-950 px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider">
                            ${ilan.durum || 'Satılık'}
                        </span>
                        <h1 class="text-2xl sm:text-3xl font-black text-white mt-2">${ilan.title || ''}</h1>
                        <p class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-location-dot text-amber-500 mr-1"></i> Sakarya / ${ilan.mahalle || ''}</p>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl sm:text-3xl font-black text-amber-400">${ilan.fiyat ? ilan.fiyat + ' TL' : 'Fiyat Belirtilmemiş'}</div>
                        <p class="text-[11px] text-slate-400 mt-1">İlan No: ${ilan.ilanno || 'ALA-100'}</p>
                    </div>
                </div>

                <!-- Fotoğraf ve Danışman Paneli -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Sol: Fotoğraf -->
                    <div class="lg:col-span-2 bg-[#131b2e] border border-slate-800 rounded-3xl overflow-hidden shadow-xl">
                        <img src="${ilan.image || 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200'}" alt="${ilan.title}" class="w-full h-[400px] object-cover">
                    </div>

                    <!-- Sağ: Danışman Kartı -->
                    <div class="bg-[#131b2e] border border-slate-800 p-6 rounded-3xl flex flex-col justify-between space-y-6">
                        <div>
                            <div class="flex items-center space-x-4">
                                <div class="w-16 h-16 rounded-2xl bg-amber-500/20 border border-amber-500/30 overflow-hidden flex items-center justify-center text-amber-400 font-bold text-xl">
                                    ALA
                                </div>
                                <div>
                                    <h3 class="font-extrabold text-white text-base">${ilan.danisman?.adi || 'Yusuf İşçi'}</h3>
                                    <p class="text-xs text-amber-400 font-medium">ALA GAYRİMENKUL DANIŞMANI</p>
                                </div>
                            </div>
                            <div class="mt-6 space-y-3 text-xs">
                                <div class="flex justify-between py-2 border-b border-slate-800">
                                    <span class="text-slate-400">Cep Telefonu</span>
                                    <span class="font-bold text-white">${ilan.danisman?.telefon || '0 (532) 407 53 38'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <a href="tel:${ilan.danisman?.telefon || '+905324075338'}" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-center text-xs transition shadow-md">
                                <i class="fa-solid fa-phone mr-2"></i> Danışmanı Ara
                            </a>
                            <a href="https://wa.me/${(ilan.danisman?.telefon || '905324075338').replace(/[^0-9]/g, '')}" target="_blank" class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-center text-xs transition shadow-md">
                                <i class="fa-brands fa-whatsapp mr-2"></i> WhatsApp İletişim
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Açıklama ve Detaylar -->
                <div class="bg-[#131b2e] border border-slate-800 p-8 rounded-3xl space-y-6">
                    <h2 class="text-lg font-extrabold text-white border-b border-slate-800 pb-3">İlan Açıklaması</h2>
                    <div class="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">
                        ${ilan.aciklama || 'Bu ilan için henüz açıklama girilmemiş.'}
                    </div>
                </div>
            `;
        }

        window.onload = ilanDetayiniGetir;
    </script>
</body>
</html>
