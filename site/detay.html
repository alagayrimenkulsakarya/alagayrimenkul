    <!-- İLAN DETAY ALANI -->
    <main class="max-w-[1400px] mx-auto px-4 py-10 w-full space-y-6">

    <!-- FOOTER -->
    <footer class="bg-[#070a11] text-slate-500 py-6 border-t border-slate-800 text-center text-xs mt-12">

    </footer>

    <!-- SCRIPT -->
    <script>
        async function ilanDetayiniGetir() {
            const params = new URLSearchParams(window.location.search);
            const kategori = params.get('kategori');
            const dosya = params.get('dosya');

            if (!kategori || !dosya) {
                document.getElementById('detay-icerik').innerHTML = `
                    <div class="text-center py-20 text-slate-400">
                        <p class="text-lg font-bold text-white mb-2">Aradığınız ilan bulunamadı veya yayından kaldırıldı.</p>
                        <a href="portfoy.html" class="text-amber-400 underline text-sm">Portföye dön</a>
                    </div>
                `;
                return;
            }

            const repoOwner = "alagayrimenkulsakarya";
            const repoName = "alagayrimenkul";
            const url = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/content/${kategori}/${dosya}`;

            try {
                const res = await fetch(url);
                if (res.ok) {
                    const md = await res.text();
                    const ilan = parseMarkdownSimple(md);
                    ilan.kategori = kategori;
                    detayiEkranaBas(ilan, repoOwner, repoName);
                } else {
                    throw new Error('İlan dosyasına ulaşılamadı.');
                }
            } catch (e) {
                document.getElementById('detay-icerik').innerHTML = `
                    <div class="text-center py-20 text-red-400">
                        <p>İlan yüklenirken hata oluştu: ${e.message}</p>
                    </div>
                `;
            }
        }

        function parseMarkdownSimple(md) {
            const frontmatterMatch = md.match(/---\s*([\s\S]*?)\s*---/);
            const data = { images: [], danisman: {} };
            if (!frontmatterMatch) {
                data.aciklama = md;
                return data;
            }

            const fm = frontmatterMatch[1];
            const lines = fm.split('\n');
            let section = '';

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;
                if (trimmed.startsWith('danisman:')) { section = 'danisman'; return; }
                if (trimmed.startsWith('images:')) { section = 'images'; return; }

                if (section === 'images' && trimmed.startsWith('-')) {
                    let val = trimmed.replace(/^-\s*['"](.*)['"]$/, '$1').replace(/^-\s*/, '');
                    if (val) data.images.push(val);
                    return;
                }

                const parts = trimmed.split(':');
                if (parts.length >= 2) {
                    const key = parts[0].trim();
                    let val = parts.slice(1).join(':').trim().replace(/^['"](.*)['"]$/, '$1');

                    if (section === 'danisman') {
                        data.danisman[key] = val;
                    } else {
                        if (trimmed.startsWith('  ') && section === 'danisman') {
                            data.danisman[key] = val;
                        } else {
                            section = '';
                            data[key] = val;
                        }
                    }
                }
            });

            data.aciklama = md.replace(/---\s*([\s\S]*?)\s*---/, '').trim();
            return data;
        }

        function duzeltResimYolu(yol, owner, repo) {
            if (!yol) return '';
            if (yol.startsWith('http')) return yol;
            if (yol.startsWith('/')) yol = yol.substring(1);
            return `https://raw.githubusercontent.com/${owner}/${repo}/main/${yol}`;
        }

        function detayiEkranaBas(ilan, owner, repo) {
            document.title = `${ilan.title || 'İlan Detayı'} | Ala Gayrimenkul`;

            let resimler = [];
            if (Array.isArray(ilan.images) && ilan.images.length > 0) {
                resimler = ilan.images.map(r => duzeltResimYolu(r, owner, repo));
            } else if (ilan.image) {
                resimler = [duzeltResimYolu(ilan.image, owner, repo)];
            } else {
                resimler = ['https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200'];
            }

            const danismanFoto = duzeltResimYolu(ilan.danisman?.fotograf, owner, repo);

            let ozelliklerHtml = `
                <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">İlan No</span><span class="font-bold">${ilan.ilanno || 'ALA-100'}</span></li>
                <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Emlak Tipi</span><span class="font-bold">${ilan.durum || 'Satılık'}</span></li>
                <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Mahalle</span><span class="font-bold">${ilan.mahalle || '-'}</span></li>
            `;

            if (ilan.kategori === 'daire') {
                ozelliklerHtml += `
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Brüt m²</span><span class="font-bold">${ilan.fBrut || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Net m²</span><span class="font-bold">${ilan.fNet || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Oda Sayısı</span><span class="font-bold">${ilan.fOda || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Bina Yaşı</span><span class="font-bold">${ilan.fYas || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Bulunduğu Kat</span><span class="font-bold">${ilan.fKat || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Isıtma Tipi</span><span class="font-bold">${ilan.fIsitma || '-'}</span></li>
                `;
            } else if (ilan.kategori === 'mustakilev') {
                ozelliklerHtml += `
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Brüt m²</span><span class="font-bold">${ilan.fBrut || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Net m²</span><span class="font-bold">${ilan.fNet || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Arsa Alanı m²</span><span class="font-bold">${ilan.fArsaAlan || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Oda Sayısı</span><span class="font-bold">${ilan.fOda || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Kat Sayısı</span><span class="font-bold">${ilan.fKatSayisi || '-'}</span></li>
                `;
            } else if (ilan.kategori === 'arsa') {
                ozelliklerHtml += `
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Toplam m²</span><span class="font-bold">${ilan.fBrut || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">m² Fiyatı</span><span class="font-bold">${ilan.fM2Fiyat || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">İmar Durumu</span><span class="font-bold">${ilan.fImar || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Ada / Parsel</span><span class="font-bold">${ilan.fAdaParsel || '-'}</span></li>
                `;
            } else if (ilan.kategori === 'isyeri') {
                ozelliklerHtml += `
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">İş Yeri Türü</span><span class="font-bold">${ilan.fIsTuru || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">m²</span><span class="font-bold">${ilan.fBrut || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Bölüm / Oda</span><span class="font-bold">${ilan.fOda || '-'}</span></li>
                    <li class="flex justify-between py-2 border-b border-slate-800"><span class="text-slate-400">Aidat</span><span class="font-bold">${ilan.fAidat || '-'}</span></li>
                `;
            }

            const container = document.getElementById('detay-icerik');
            container.innerHTML = `
                <!-- Üst Başlık ve Fiyat -->
                <div class="bg-[#131b2e] border border-slate-800 p-6 rounded-3xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <span class="bg-amber-600 text-slate-950 px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider">
                            ${ilan.durum || 'Satılık'}
                        </span>
                        <h1 class="text-2xl sm:text-3xl font-black text-white mt-2">${ilan.title || ''}</h1>
                        <p class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-location-dot text-amber-500 mr-1"></i> Sakarya / ${ilan.mahalle || ''}</p>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl sm:text-3xl font-black text-amber-400">${ilan.fiyat ? ilan.fiyat + ' TL' : 'Fiyat Belirtilmemiş'}</div>
                        <p class="text-[11px] text-slate-400 mt-1">İlan No: ${ilan.ilanno || 'ALA-100'}</p>
                    </div>
                </div>

                <!-- Sahibinden Tarzı 2 Kolonlu Üst Bölüm (Fotoğraflar + Özellikler Tablosu) -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- Sol Kolon (Fotoğraflar): 7 Birim -->
                    <div class="lg:col-span-7 bg-[#131b2e] border border-slate-800 p-4 rounded-3xl space-y-4 shadow-xl">
                        <div class="relative h-[400px] rounded-2xl overflow-hidden bg-black">
                            <img id="ana-foto" src="${resimler[0]}" alt="${ilan.title}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex gap-2 overflow-x-auto pb-2">
                            ${resimler.map((img) => `
                                <img src="${img}" onclick="document.getElementById('ana-foto').src='${img}'" class="w-20 h-16 object-cover rounded-xl cursor-pointer border-2 border-slate-700 hover:border-amber-500 transition shrink-0">
                            `).join('')}
                        </div>
                    </div>

                    <!-- Sağ Kolon (Özellikler Tablosu): 5 Birim -->
                    <div class="lg:col-span-5 bg-[#131b2e] border border-slate-800 p-6 rounded-3xl space-y-3">
                        <h3 class="text-sm font-extrabold text-white border-b border-slate-800 pb-3">İlan Özellikleri</h3>
                        <ul class="space-y-1 text-xs text-slate-300">
                            ${ozelliklerHtml}
                        </ul>
                    </div>
                </div>

                <!-- Alt Bölüm: Açıklama ve Sabit Boyutlu Danışman Kartı (Yan Yana) -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <!-- Sol: Açıklama (8 Birim) -->
                    <div class="lg:col-span-8 bg-[#131b2e] border border-slate-800 p-8 rounded-3xl space-y-6">
                        <h2 class="text-lg font-extrabold text-white border-b border-slate-800 pb-3">İlan Açıklaması</h2>
                        <div class="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">
                            ${ilan.aciklama || 'Bu ilan için henüz açıklama girilmemiş.'}
                        </div>
                    </div>

                    <!-- Sağ: Danışman Kartı (4 Birim - Sabit ve Şık) -->
                    <div class="lg:col-span-4 bg-[#131b2e] border border-slate-800 p-6 rounded-3xl space-y-6">
                        <div>
                            <div class="flex items-center space-x-4">
                                <div class="w-16 h-16 rounded-2xl bg-amber-500/20 border border-amber-500/30 overflow-hidden flex items-center justify-center text-amber-400 font-bold shrink-0">
                                    ${danismanFoto ? `<img src="${danismanFoto}" class="w-full h-full object-cover">` : 'ALA'}
                                </div>
                                <div class="overflow-hidden">
                                    <h3 class="font-extrabold text-white text-base truncate">${ilan.danisman?.adi || 'Yusuf İşçi'}</h3>
                                    <p class="text-xs text-amber-400 font-medium truncate">ALA GAYRİMENKUL DANIŞMANI</p>
                                </div>
                            </div>
                            <div class="mt-6 space-y-3 text-xs">
                                <div class="flex justify-between py-2 border-b border-slate-800">
                                    <span class="text-slate-400">Cep Telefonu</span>
                                    <span class="font-bold text-white">${ilan.danisman?.telefon || '0 (532) 407 53 38'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-2 pt-2">
                            <a href="tel:${ilan.danisman?.telefon || '+905324075338'}" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-center text-xs transition shadow-md">
                                <i class="fa-solid fa-phone mr-2"></i> Danışmanı Ara
                            </a>
                            <a href="https://wa.me/${(ilan.danisman?.telefon || '905324075338').replace(/[^0-9]/g, '')}" target="_blank" class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-center text-xs transition shadow-md">
                                <i class="fa-brands fa-whatsapp mr-2"></i> WhatsApp İletişim
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        window.onload = ilanDetayiniGetir;
    </script>
</body>
