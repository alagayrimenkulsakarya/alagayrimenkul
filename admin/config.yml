backend:
  name: github
  repo: alagayrimenkulsakarya/alagayrimenkul
  branch: main
  auth_type: implicit

media_folder: "images"
public_folder: "/images"

collections:
  - name: "daire"
    label: "Daire"
    folder: "content/daire"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "İlan Başlığı", name: "title", widget: "string"}
      - {label: "İlan No", name: "ilanno", widget: "string"}
      - {label: "İlan Durumu", name: "durum", widget: "select", options: ["Satılık", "Kiralık"]}
      - {label: "Fiyat (TL)", name: "fiyat", widget: "string"}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "Fotoğraf Galerisi (Çoklu)", name: "gallery", widget: "list", field: {label: "Görsel", name: "image", widget: "image"}, required: false}
      - {label: "Video URL / YouTube", name: "video_url", widget: "string", required: false}
      - {label: "Brüt m²", name: "brut", widget: "string"}
      - {label: "Net m²", name: "net", widget: "string"}
      - {label: "Oda Sayısı", name: "odasayisi", widget: "select", options: ["1+0", "1+1", "2+1", "3+1", "4+1", "4+2", "5+1"]}
      - {label: "Bina Yaşı", name: "binayasi", widget: "string"}
      - {label: "Bulunduğu Kat", name: "kat", widget: "string"}
      - {label: "Kat Sayısı", name: "katsayisi", widget: "string"}
      - {label: "Isıtma Tipi", name: "isitma", widget: "select", options: ["Kombi (Doğalgaz)", "Yerden Isıtma", "Merkezi", "Klima", "Soba"]}
      - {label: "Banyo Sayısı", name: "banyosayisi", widget: "string", default: "1"}
      - {label: "Balkon", name: "balkon", widget: "boolean", default: true}
      - {label: "Asansör", name: "asansor", widget: "boolean", default: true}
      - {label: "Otopark", name: "otopark", widget: "select", options: ["Açık Otopark", "Kapalı Otopark", "Yok"]}
      - {label: "Eşyalı mı?", name: "esyali", widget: "boolean", default: false}
      - {label: "Kullanım Durumu", name: "kullanim", widget: "select", options: ["Boş", "Kiracılı", "Mülk Sahibi Oturuyor"]}
      - {label: "Tapu Durumu", name: "tapu", widget: "select", options: ["Kat Mülkiyetli", "Kat İrtifaklı", "Hisseli Tapu", "Arsa Tapulu"]}
      - {label: "Krediye Uygunluk", name: "kredi", widget: "boolean", default: true}
      - {label: "Cephe", name: "cephe", widget: "select", options: ["Kuzey", "Güney", "Doğu", "Batı", "Kuzey-Güney", "Güney-Doğu"]}
      - {label: "İl", name: "il", widget: "string", default: "Sakarya"}
      - {label: "İlçe", name: "ilce", widget: "string", default: "Adapazarı"}
      - {label: "Mahalle", name: "mahalle", widget: "string"}
      - {label: "Danışman Adı", name: "danisman_adi", widget: "string", default: "Yusuf İşçi"}
      - {label: "Danışman Telefonu", name: "danisman_tel", widget: "string", default: "0 (532) 407 53 38"}
      - {label: "Danışman Fotoğrafı", name: "danisman_foto", widget: "image", required: false}
      - {label: "İlan Detaylı Açıklaması", name: "body", widget: "markdown"}

  - name: "mustakilev"
    label: "Müstakil Ev"
    folder: "content/mustakilev"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "İlan Başlığı", name: "title", widget: "string"}
      - {label: "İlan No", name: "ilanno", widget: "string"}
      - {label: "İlan Durumu", name: "durum", widget: "select", options: ["Satılık", "Kiralık"]}
      - {label: "Fiyat (TL)", name: "fiyat", widget: "string"}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "Fotoğraf Galerisi", name: "gallery", widget: "list", field: {label: "Görsel", name: "image", widget: "image"}, required: false}
      - {label: "Video URL", name: "video_url", widget: "string", required: false}
      - {label: "Brüt m²", name: "brut", widget: "string"}
      - {label: "Net m²", name: "net", widget: "string"}
      - {label: "Arsa Alanı m²", name: "arsa_alani", widget: "string"}
      - {label: "Oda Sayısı", name: "odasayisi", widget: "select", options: ["2+1", "3+1", "4+1", "5+1", "6+1 ve Üzeri"]}
      - {label: "Bina Yaşı", name: "binayasi", widget: "string"}
      - {label: "Kat Sayısı", name: "katsayisi", widget: "string"}
      - {label: "Isıtma Tipi", name: "isitma", widget: "string"}
      - {label: "Özel Havuz", name: "havuz", widget: "boolean", default: false}
      - {label: "Otopark", name: "otopark", widget: "string", default: "Özel Otopark"}
      - {label: "Tapu Durumu", name: "tapu", widget: "string", default: "Müstakil Parsel"}
      - {label: "İlçe", name: "ilce", widget: "string", default: "Adapazarı"}
      - {label: "Mahalle / Köy", name: "mahalle", widget: "string"}
      - {label: "Danışman Adı", name: "danisman_adi", widget: "string", default: "Yusuf İşçi"}
      - {label: "Danışman Telefonu", name: "danisman_tel", widget: "string", default: "0 (532) 407 53 38"}
      - {label: "Danışman Fotoğrafı", name: "danisman_foto", widget: "image", required: false}
      - {label: "İlan Detaylı Açıklaması", name: "body", widget: "markdown"}

