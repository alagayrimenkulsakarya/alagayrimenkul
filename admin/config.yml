      - {label: "Kat Sayısı", name: "katsayisi", widget: "string"}
      - {label: "İlçe", name: "ilce", widget: "string", default: "Adapazarı"}
      - {label: "Mahalle", name: "mahalle", widget: "string"}
      - {label: "Danışman Adı", name: "danisman_adi", widget: "string", default: "Yusuf İşçi"}
      - {label: "Danışman Telefonu", name: "danisman_tel", widget: "string", default: "0 (532) 407 53 38"}
      - {label: "İlan Açıklaması", name: "body", widget: "markdown"}

