backend:
  name: github
  repo: alagayrimenkulsakarya/alagayrimenkul
  branch: main
  auth_type: implicit

media_folder: "images"
public_folder: "/images"

collections:
  - name: "daire"
    label: "Daire İlanları"
    folder: "content/daire"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "İlan Başlığı", name: "title", widget: "string"}
      - {label: "İlan No", name: "ilanno", widget: "string"}
      - {label: "İlan Durumu", name: "durum", widget: "select", options: ["Satılık", "Kiralık"]}
      - {label: "Fiyat (TL)", name: "fiyat", widget: "string"}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "Brüt m²", name: "brut", widget: "string"}
      - {label: "Net m²", name: "net", widget: "string"}
      - {label: "Oda Sayısı", name: "odasayisi", widget: "select", options: ["1+0", "1+1", "2+1", "3+1", "4+1", "4+2", "5+1"]}
      - {label: "Bina Yaşı", name: "binayasi", widget: "string"}
      - {label: "Bulunduğu Kat", name: "kat", widget: "string"}
      - {label: "Kat Sayısı", name: "katsayisi", widget: "string"}
      - {label: "Isıtma Tipi", name: "isitma", widget: "string"}
      - {label: "İlçe", name: "ilce", widget: "string", default: "Adapazarı"}
      - {label: "Mahalle", name: "mahalle", widget: "string"}
      - {label: "Danışman Adı", name: "danisman_adi", widget: "string", default: "Yusuf İşçi"}
      - {label: "Danışman Telefonu", name: "danisman_tel", widget: "string", default: "0 (532) 407 53 38"}
      - {label: "Danışman Fotoğrafı", name: "danisman_foto", widget: "image", required: false}
      - {label: "İlan Açıklaması", name: "body", widget: "markdown"}

  - name: "mustakilev"
    label: "Müstakil Ev / Villa"
    folder: "content/mustakilev"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "İlan Başlığı", name: "title", widget: "string"}
      - {label: "İlan No", name: "ilanno", widget: "string"}
      - {label: "İlan Durumu", name: "durum", widget: "select", options: ["Satılık", "Kiralık"]}
      - {label: "Fiyat (TL)", name: "fiyat", widget: "string"}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "Brüt m²", name: "brut", widget: "string"}
      - {label: "Net m²", name: "net", widget: "string"}
      - {label: "Oda Sayısı", name: "odasayisi", widget: "select", options: ["2+1", "3+1", "4+1", "5+1", "6+1 ve Üzeri"]}
      - {label: "Bina Yaşı", name: "binayasi", widget: "string"}
      - {label: "İlçe", name: "ilce", widget: "string", default: "Adapazarı"}
      - {label: "Mahalle", name: "mahalle", widget: "string"}
      - {label: "Danışman Adı", name: "danisman_adi", widget: "string", default: "Yusuf İşçi"}
      - {label: "Danışman Telefonu", name: "danisman_tel", widget: "string", default: "0 (532) 407 53 38"}
      - {label: "Danışman Fotoğrafı", name: "danisman_foto", widget: "image", required: false}
      - {label: "İlan Açıklaması", name: "body", widget: "markdown"}

  - name: "arsa"
    label: "Arsa / Tarla"
    folder: "content/arsa"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "İlan Başlığı", name: "title", widget: "string"}
      - {label: "İlan No", name: "ilanno", widget: "string"}
      - {label: "İlan Durumu", name: "durum", widget: "select", options: ["Satılık", "Kiralık"]}
      - {label: "Fiyat (TL)", name: "fiyat", widget: "string"}
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image"}
      - {label: "Toplam m²", name: "arsam2", widget: "string"}
      - {label: "İmar Durumu", name: "imardurumu", widget: "select", options: ["Konut", "Ticari", "Sanayi", "Tarla", "Zeytinlik", "İmarsız"]}
      - {label: "Ada No", name: "ada", widget: "string"}
      - {label: "Parsel No", name: "parsel", widget: "string"}
      - {label: "İlçe", name: "ilce", widget: "string", default: "Adapazarı"}
      - {label: "Mahalle / Köy", name: "mahalle", widget: "string"}
      - {label: "Danışman Adı", name: "danisman_adi", widget: "string", default: "Yusuf İşçi"}
      - {label: "Danışman Telefonu", name: "danisman_tel", widget: "string", default: "0 (532) 407 53 38"}
      - {label: "Danışman Fotoğrafı", name: "danisman_foto", widget: "image", required: false}
      - {label: "İlan Açıklaması", name: "body", widget: "markdown"}
